<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner - QR Event Manager</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- HTML5 QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans text-gray-800">

  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Ticket Scanner</h1>
      <a href="index.html" class="text-blue-600 hover:underline">← Back to Dashboard</a>
    </div>

    <!-- The Box Where the Camera Will Show -->
    <div id="reader" class="w-full mb-6 rounded border-2 border-gray-300 overflow-hidden"></div>

    <!-- The Results Box -->
    <div id="result-box" class="hidden p-4 rounded-md text-center shadow-inner">
      <h2 id="result-title" class="text-xl font-bold mb-2"></h2>
      <p id="result-message" class="text-gray-700"></p>
      <button id="scanAgainBtn" class="mt-4 bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-900 w-full">
        Scan Next Ticket
      </button>
    </div>
  </div>

  <script>
    // 1. YOUR KEYS (Keep your real keys here!)
    const SUPABASE_URL = 'https://wpqpqlwjprtwoblhvenw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_89l1fu6nVSWxGVOH-g1dQw_i99aUXt9';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Variables for the Scanner
    let html5QrCode; // We changed this from the scanner UI to the direct controller
    const resultBox = document.getElementById('result-box');
    const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');
    const readerDiv = document.getElementById('reader');

    // 3. Security Check: Are they logged in?
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert("You must be logged in to use the scanner.");
        window.location.href = 'index.html';
      } else {
        startScanner();
      }
    }

    // 4. Start the Camera - FORCING THE REAR LENS
    function startScanner() {
      resultBox.classList.add('hidden');
      readerDiv.classList.remove('hidden');

      // Use the direct Html5Qrcode API to bypass the buggy dropdown menu
      html5QrCode = new Html5Qrcode("reader");

      const cameraConfig = { 
        fps: 10, 
        qrbox: { width: 220, height: 220 } 
      };

      // This specifically commands mobile phones to use the main rear camera
      html5QrCode.start({ facingMode: "environment" }, cameraConfig, onScanSuccess, onScanFailure)
        .catch((err) => {
          console.error("Rear camera failed, trying fallback: ", err);
          // If the rear camera fails, try whatever default camera it can find
          html5QrCode.start({ facingMode: "user" }, cameraConfig, onScanSuccess, onScanFailure);
        });
    }

    // 5. What happens when a QR code is successfully read?
    async function onScanSuccess(decodedText, decodedResult) {
      // Stop the camera hardware so the screen freezes on success
      html5QrCode.stop().then(() => {
        readerDiv.classList.add('hidden');
        
        resultBox.classList.remove('hidden');
        resultBox.className = 'p-4 rounded-md text-center shadow-inner bg-yellow-50 border-yellow-200 border';
        resultTitle.innerText = 'Checking Ticket...';
        resultTitle.className = 'text-xl font-bold mb-2 text-yellow-800';
        resultMessage.innerText = `QR Payload: ${decodedText}`;
      }).catch((err) => {
         console.error("Failed to stop camera.", err);
      });
    }

    // 6. What happens if the scan fails (ignore this, it fails every frame until it finds a code)
    function onScanFailure(error) {
      // Hidden so it doesn't spam your console
    }

    // 7. Reset button
    document.getElementById('scanAgainBtn').addEventListener('click', () => {
      startScanner();
    });

    // Run the security check on page load
    checkAuth();
  </script>

</body>
</html>
