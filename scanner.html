<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner - QR Event Manager</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- HTML5 QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans text-gray-800">

  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
    
    <!-- GATEMAN LOGIN OVERLAY -->
    <div id="login-screen" class="bg-white z-50 flex flex-col items-center justify-center py-10">
      <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Staff Login</h2>
      <p class="text-sm text-gray-500 mb-6 text-center">Enter your assigned PIN to access the scanner.</p>
      <input type="password" id="pinInput" placeholder="Enter PIN" class="w-full max-w-xs p-3 border border-gray-300 rounded-lg mb-4 text-center text-xl tracking-[0.5em] font-mono outline-none focus:border-blue-500">
      <button onclick="handlePinLogin()" class="w-full max-w-xs bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Access Scanner</button>
      <p id="loginError" class="text-red-500 text-sm mt-4 hidden">Invalid PIN. Please try again.</p>
    </div>

    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Ticket Scanner</h1>
        <p id="staffInfoDisplay" class="text-xs text-gray-500 font-semibold hidden">Logged in as: <span id="staffNameSpan" class="text-blue-600"></span></p>
      </div>
      <a href="index.html" class="text-blue-600 hover:underline text-sm">← Dashboard</a>
    </div>

    <!-- SCANNER MODE TOGGLES -->
    <div id="mode-toggles" class="flex gap-2 mb-6 hidden">
      <button id="btnModeEntry" onclick="setScanMode('Entry')" class="flex-1 py-3 rounded-lg font-bold border-2 border-green-500 bg-green-50 text-green-700 transition">SCAN ENTRY</button>
      <button id="btnModeExit" onclick="setScanMode('Exit')" class="flex-1 py-3 rounded-lg font-bold border-2 border-transparent bg-gray-100 text-gray-500 hover:bg-gray-200 transition">SCAN EXIT</button>
    </div>

    <!-- The Box Where the Camera Will Show -->
    <div id="reader" class="w-full mb-6 rounded border-2 border-gray-300 overflow-hidden hidden"></div>

    <!-- The Results Box -->
    <div id="result-box" class="hidden p-4 rounded-md text-center shadow-inner">
      <h2 id="result-title" class="text-xl font-bold mb-2"></h2>
      <p id="result-message" class="text-gray-700"></p>
      <button id="scanAgainBtn" class="mt-4 bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-900 w-full">
        Scan Next Ticket
      </button>
    </div>
  </div>

  <script>
    // 1. YOUR KEYS (Keep your real keys here!)
    const SUPABASE_URL = 'https://wpqpqlwjprtwoblhvenw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_89l1fu6nVSWxGVOH-g1dQw_i99aUXt9';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Variables for the Scanner & Session
    let html5QrCode; 
    const resultBox = document.getElementById('result-box');
    const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');
    const readerDiv = document.getElementById('reader');
    
    // Session Data
    let activeGatemanId = null;
    let activeGateId = null;
    let activeTenantId = null;
    let currentScanMode = 'Entry'; // Default mode

   // 3. Handle PIN Login
    async function handlePinLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const errorMsg = document.getElementById('loginError');
      
      if (!pin) return;
      errorMsg.classList.add('hidden');

      // Query Supabase for the Gateman
      const { data: staff, error } = await supabaseClient
        .from('gatemen')
        .select('*, gates(gate_name, gate_type)')
        .eq('access_code', pin)
        .single();

      if (error || !staff) {
        errorMsg.classList.remove('hidden');
        return;
      }

      if (!staff.assigned_gate_id) {
        alert("You are not currently assigned to a gate. Contact the organizer.");
        return;
      }

      // Store credentials
      activeGatemanId = staff.id;
      activeGateId = staff.assigned_gate_id;
      activeTenantId = staff.tenant_id;
      
      // Determine Gate Type and adjust buttons
      const gType = staff.gates.gate_type;
      const btnIn = document.getElementById('btnModeEntry');
      const btnOut = document.getElementById('btnModeExit');
      
      btnIn.style.display = (gType === 'Both' || gType === 'Entry') ? 'block' : 'none';
      btnOut.style.display = (gType === 'Both' || gType === 'Exit') ? 'block' : 'none';
      
      if (gType === 'Exit') setScanMode('Exit');
      else setScanMode('Entry');

      // Update UI
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('mode-toggles').classList.remove('hidden');
      document.getElementById('staffInfoDisplay').classList.remove('hidden');
      document.getElementById('staffNameSpan').innerText = `${staff.name} (${staff.gates.gate_name})`;

      startScanner();
    }

      if (error || !staff) {
        errorMsg.classList.remove('hidden');
        return;
      }

      if (!staff.assigned_gate_id) {
        alert("You are not currently assigned to a gate. Contact the organizer.");
        return;
      }

      // Store credentials
      activeGatemanId = staff.id;
      activeGateId = staff.assigned_gate_id;
      activeTenantId = staff.tenant_id;

      // Update UI
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('mode-toggles').classList.remove('hidden');
      document.getElementById('staffInfoDisplay').classList.remove('hidden');
      document.getElementById('staffNameSpan').innerText = `${staff.name} (${staff.gates.gate_name})`;

      startScanner();
    }

    // 3b. Toggle Scan Mode (Entry / Exit)
    function setScanMode(mode) {
      currentScanMode = mode;
      const btnIn = document.getElementById('btnModeEntry');
      const btnOut = document.getElementById('btnModeExit');
      
      if (mode === 'Entry') {
        btnIn.className = 'flex-1 py-3 rounded-lg font-bold border-2 border-green-500 bg-green-50 text-green-700 transition';
        btnOut.className = 'flex-1 py-3 rounded-lg font-bold border-2 border-transparent bg-gray-100 text-gray-500 hover:bg-gray-200 transition';
      } else {
        btnOut.className = 'flex-1 py-3 rounded-lg font-bold border-2 border-blue-500 bg-blue-50 text-blue-700 transition';
        btnIn.className = 'flex-1 py-3 rounded-lg font-bold border-2 border-transparent bg-gray-100 text-gray-500 hover:bg-gray-200 transition';
      }
    }

    // 4. Start the Camera - FORCING THE REAR LENS
    function startScanner() {
      resultBox.classList.add('hidden');
      readerDiv.classList.remove('hidden');

      // FIX: Only create a new scanner instance if one doesn't already exist!
      if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
      }

      const cameraConfig = { 
        fps: 10, 
        qrbox: { width: 220, height: 220 } 
      };

      // Ensure camera isn't already running before starting it
      if (html5QrCode.getState() !== 2) { // 2 means SCANNING
          html5QrCode.start({ facingMode: "environment" }, cameraConfig, onScanSuccess, onScanFailure)
            .catch((err) => {
              console.error("Rear camera failed, trying fallback: ", err);
              html5QrCode.start({ facingMode: "user" }, cameraConfig, onScanSuccess, onScanFailure);
            });
      }
    }

      // This specifically commands mobile phones to use the main rear camera
      html5QrCode.start({ facingMode: "environment" }, cameraConfig, onScanSuccess, onScanFailure)
        .catch((err) => {
          console.error("Rear camera failed, trying fallback: ", err);
          // If the rear camera fails, try whatever default camera it can find
          html5QrCode.start({ facingMode: "user" }, cameraConfig, onScanSuccess, onScanFailure);
        });
    }

    // 5. What happens when a QR code is successfully read?
    async function onScanSuccess(decodedText, decodedResult) {
      html5QrCode.stop().then(async () => {
        readerDiv.classList.add('hidden');
        document.getElementById('mode-toggles').classList.add('hidden'); // Hide toggles during result
        
        resultBox.classList.remove('hidden');
        resultBox.className = 'p-4 rounded-md text-center shadow-inner bg-blue-50 border-blue-200 border';
        resultTitle.innerText = 'Verifying Ticket...';
        resultTitle.className = 'text-xl font-bold mb-2 text-blue-800';
        resultMessage.innerText = 'Checking database records...';

        // 1. Fetch guest record
        const { data: guest, error } = await supabaseClient
          .from('guests')
          .select('*, events(is_approved, expires_at)')
          .eq('id', decodedText)
          .single(); 

        if (error || !guest) {
          showScanResult('Invalid Ticket ❌', 'This ticket does not exist in the database.', 'red');
          return;
        }

        // 2. CHECK EVENT APPROVAL & EXPIRATION RULES
        if (!guest.events || !guest.events.is_approved) {
          showScanResult('Event Not Approved ❌', 'This event is pending admin approval.', 'red');
          return;
        }

        if (guest.events.expires_at && new Date(guest.events.expires_at) < new Date()) {
          showScanResult('Event Expired 🔒', 'This event time window has closed.', 'red');
          return;
        }

        // 3. LOGIC FOR 'ENTRY' MODE
        if (currentScanMode === 'Entry') {
            const allowed = guest.allowed_capacity || 1;
            const currentChecked = guest.checked_in_count || 0;

            if (currentChecked >= allowed) {
                showScanResult('⚠️ Fully Checked In', `Warning: All ${allowed} entries for ${guest.guest_name} have already been used!`, 'orange');
                return;
            }

            // Insert Scan Log
            await logScanToDatabase(guest, 'Entry');
            
            // Increment count & update status
            const newCount = currentChecked + 1;
            await supabaseClient.from('guests').update({ checked_in_count: newCount, current_status: 'Inside' }).eq('id', guest.id);
            
            showScanResult(`Entry Granted (${newCount}/${allowed}) ✅`, `Welcome, ${guest.guest_name}! Entry logged.`, 'green');
        } 
        
        // 4. LOGIC FOR 'EXIT' MODE
        else {
            if (guest.current_status === 'Exited') {
                showScanResult('⚠️ Already Exited', `${guest.guest_name} has already checked out.`, 'orange');
                return;
            }

            // Insert Scan Log
            await logScanToDatabase(guest, 'Exit');
            
            // Update status
            await supabaseClient.from('guests').update({ current_status: 'Exited' }).eq('id', guest.id);
            
            showScanResult('Exit Logged 🚪', `Goodbye, ${guest.guest_name}. Exit successful.`, 'blue');
        }

      }).catch((err) => console.error("Failed to stop camera.", err));
    } // <-- This correctly closes the onScanSuccess function

    // Helper: Insert the log into the database
    async function logScanToDatabase(guest, type) {
        await supabaseClient.from('scan_logs').insert([{
            tenant_id: activeTenantId,
            event_id: guest.event_id,
            guest_id: guest.id,
            gate_id: activeGateId,
            gateman_id: activeGatemanId,
            scan_type: type
        }]);
    }

    // Helper: Paint the result box
    function showScanResult(title, msg, colorStr) {
        let bg = 'bg-gray-50'; let border = 'border-gray-200'; let text = 'text-gray-800';
        if (colorStr === 'red') { bg = 'bg-red-50'; border = 'border-red-200'; text = 'text-red-800'; }
        if (colorStr === 'orange') { bg = 'bg-orange-50'; border = 'border-orange-200'; text = 'text-orange-800'; }
        if (colorStr === 'green') { bg = 'bg-green-50'; border = 'border-green-200'; text = 'text-green-800'; }
        if (colorStr === 'blue') { bg = 'bg-blue-50'; border = 'border-blue-200'; text = 'text-blue-800'; }
        
        resultBox.className = `p-4 rounded-md text-center shadow-inner ${bg} border border-solid ${border}`;
        resultTitle.className = `text-xl font-bold mb-2 ${text}`;
        resultTitle.innerText = title;
        resultMessage.innerText = msg;
    }

    // 6. What happens if the scan fails (ignore this, it fails every frame until it finds a code)
    function onScanFailure(error) {
      // Hidden so it doesn't spam your console
    }

    // 7. Reset button
    document.getElementById('scanAgainBtn').addEventListener('click', () => {
      document.getElementById('mode-toggles').classList.remove('hidden');
      startScanner();
    });

  </script>

</body>
</html>
