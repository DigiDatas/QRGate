<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Event Manager</title>
  
  <!-- 1. Bring in Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. Bring in Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans text-gray-800">

  <div class="max-w-xl mx-auto bg-white p-6 md:p-10 rounded-lg shadow-md text-center mt-10">
    <h1 class="text-3xl font-bold mb-6 text-gray-900">QR Event Manager</h1>
    
    <!-- Login Section -->
    <div id="auth-section">
      <p class="mb-6 text-gray-600">Log in to manage your events and scan tickets.</p>
      <button id="loginBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 font-semibold transition w-full md:w-auto">
        Log In with Google
      </button>
    </div>

    <!-- Dashboard Section (Hidden until logged in) -->
    <div id="dashboard-section" class="hidden text-left">
      <div class="bg-green-50 border border-green-200 p-4 rounded-md mb-6">
        <p id="user-email" class="text-green-800 font-semibold"></p>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
        <div class="border p-4 rounded shadow-sm text-center bg-gray-50">
          <h3 class="font-bold text-lg">My Events</h3>
          <p class="text-gray-500 text-sm">Create and manage guest lists</p>
        </div>
        <div class="border p-4 rounded shadow-sm text-center bg-gray-50">
          <h3 class="font-bold text-lg">QR Scanner</h3>
          <p class="text-gray-500 text-sm">Open camera to scan tickets</p>
        </div>
      </div>

      <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded shadow hover:bg-red-600 w-full md:w-auto transition">
        Log Out
      </button>
    </div>
  </div>

  <script>
    // 3. Connect to your Supabase Project
    // IMPORTANT: Replace these with your actual URL and Anon Key!
    const SUPABASE_URL = 'const SUPABASE_URL = 'https://wpqpqlwjprtwoblhvenw.supabase.co';';
    const SUPABASE_ANON_KEY = 'sb_publishable_89l1fu6nVSWxGVOH-g1dQw_i99aUXt9';
    
   
    // 2. Create the connection and name it supabaseClient
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. Handle Google Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://digidatas.github.io/QRGate/'
        }
      });
    });

    // 4. Handle Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload(); 
    });

    // 5. Check if user is logged in when the page loads
    async function checkUser() {
      // Notice we are using supabaseClient here now!
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('user-email').innerText = 'Welcome back, ' + session.user.email;
      }
    }
    
    checkUser();
  </script>

</body>
</html>
