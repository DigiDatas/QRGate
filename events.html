<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event & Guest Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans text-gray-800">

  <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-md mt-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Event & Guest Manager</h1>
      <a href="index.html" class="text-blue-600 hover:underline">← Back to Dashboard</a>
    </div>

    <!-- Step 1: Create or Select Event -->
    <div class="bg-gray-50 p-4 rounded-md border mb-6">
      <h2 class="font-bold text-lg mb-3">1. Select or Create Event</h2>
      <div class="flex flex-col md:flex-row gap-3 mb-3">
        <input type="text" id="eventNameInput" placeholder="New Event Name (e.g., Tech Conference 2026)" class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="addEventBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-semibold transition">
          Create Event
        </button>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Active Event:</label>
        <select id="eventSelect" class="w-full border p-2 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">-- Loading events... --</option>
        </select>
      </div>
    </div>

    <!-- Step 2: Add Guest to Selected Event -->
    <div class="bg-gray-50 p-4 rounded-md border mb-6">
      <h2 class="font-bold text-lg mb-3">2. Add Guest to Active Event</h2>
      <div class="flex flex-col md:flex-row gap-3">
        <input type="text" id="guestNameInput" placeholder="Guest Full Name" class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="addGuestBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-semibold transition">
          Add Guest
        </button>
      </div>
    </div>

    <!-- Step 3: Guest List View -->
    <h2 class="font-bold text-lg mb-3">Registered Guests for Selected Event</h2>
    <div class="overflow-x-auto border rounded-md">
      <table class="w-full text-left border-collapse bg-white">
        <thead>
          <tr class="bg-gray-100 border-b text-sm text-gray-600">
            <th class="p-3">Guest Name</th>
            <th class="p-3">Ticket ID (UUID)</th>
            <th class="p-3">Checked In</th>
          </tr>
        </thead>
        <tbody id="guestTableBody">
          <tr>
            <td colspan="3" class="p-4 text-center text-gray-500">Select an event to view guests.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wpqpqlwjprtwoblhvenw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_89l1fu6nVSWxGVOH-g1dQw_i99aUXt9';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
      } else {
        await fetchEvents();
      }
    }

    // Fetch Events into Dropdown
    async function fetchEvents() {
      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .order('event_name', { ascending: true });

      const select = document.getElementById('eventSelect');
      select.innerHTML = '';

      if (error || !data || data.length === 0) {
        select.innerHTML = `<option value="">No events found. Create one above!</option>`;
        document.getElementById('guestTableBody').innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">Create an event first.</td></tr>`;
        return;
      }

      data.forEach(event => {
        const option = document.createElement('option');
        option.value = event.id;
        option.textContent = event.event_name;
        select.appendChild(option);
      });

      // Load guests for the first event by default
      fetchGuests();
    }

    // Create Event Handler
    document.getElementById('addEventBtn').addEventListener('click', async () => {
      const name = document.getElementById('eventNameInput').value.trim();
      if (!name) {
        alert('Please enter an event name.');
        return;
      }

      // Get the currently logged-in user's ID to use as the tenant_id
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert("You must be logged in.");
        return;
      }
      const userId = session.user.id;

      const { error } = await supabaseClient
        .from('events')
        .insert([{ 
          event_name: name, 
          total_capacity: 100, 
          tenant_id: userId // Automatically assigns it to you!
        }]);

      if (error) {
        alert('Error creating event: ' + error.message);
      } else {
        document.getElementById('eventNameInput', '').value = '';
        document.getElementById('eventNameInput').value = '';
        fetchEvents();
      }
    });

    // When dropdown changes, reload guests
    document.getElementById('eventSelect').addEventListener('change', () => {
      fetchGuests();
    });

    // Load Guests for Selected Event
    async function fetchGuests() {
      const eventId = document.getElementById('eventSelect').value;
      const tbody = document.getElementById('guestTableBody');
      
      if (!eventId) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">Please select an event.</td></tr>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from('guests')
        .select('*')
        .eq('event_id', eventId)
        .order('guest_name', { ascending: true });

      tbody.innerHTML = '';

      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">No guests found for this event yet.</td></tr>`;
        return;
      }

      data.forEach(guest => {
        const row = document.createElement('tr');
        row.className = 'border-b hover:bg-gray-50 text-sm';
        row.innerHTML = `
          <td class="p-3 font-medium">${guest.guest_name || 'Unnamed'}</td>
          <td class="p-3 font-mono text-xs text-gray-500">${guest.id}</td>
          <td class="p-3"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">${guest.checked_in_count || 0}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    // Add Guest Handler
    document.getElementById('addGuestBtn').addEventListener('click', async () => {
      const name = document.getElementById('guestNameInput').value.trim();
      const eventId = document.getElementById('eventSelect').value;

      if (!name) {
        alert('Please enter a guest name.');
        return;
      }
      if (!eventId) {
        alert('Please select an event first.');
        return;
      }

      const { error } = await supabaseClient
        .from('guests')
        .insert([{ guest_name: name, event_id: eventId, allowed_capacity: 1, checked_in_count: 0 }]);

      if (error) {
        alert('Error adding guest: ' + error.message);
      } else {
        document.getElementById('guestNameInput').value = '';
        fetchGuests();
      }
    });

    init();
  </script>
</body>
</html>
