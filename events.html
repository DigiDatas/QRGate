<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event & Guest Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans text-gray-800">

  <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-md mt-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Event & Guest Manager</h1>
      <a href="index.html" class="text-blue-600 hover:underline">← Back to Dashboard</a>
    </div>

    <!-- Event Selector -->
    <div class="bg-gray-50 p-4 rounded-md border mb-6">
      <h2 class="font-bold text-lg mb-3">Select Event</h2>
      <div class="flex flex-col md:flex-row gap-3 mb-3">
        <input type="text" id="eventNameInput" placeholder="New Event Name" class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="datetime-local" id="eventExpireInput" class="border p-2 rounded bg-white text-sm" title="Event Expiry Date">
        <button id="addEventBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-semibold transition">
          Create Event
        </button>
      </div>
      <select id="eventSelect" class="w-full border p-2 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">-- Loading events... --</option>
      </select>
    </div>

    <!-- LIVE ANALYTICS SUMMARY BAR -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg text-center">
        <p class="text-xs text-blue-600 font-bold uppercase">Total Registered</p>
        <p id="statTotal" class="text-2xl font-extrabold text-blue-900">0</p>
      </div>
      <div class="bg-green-50 border border-green-200 p-4 rounded-lg text-center">
        <p class="text-xs text-green-600 font-bold uppercase">Checked In</p>
        <p id="statCheckedIn" class="text-2xl font-extrabold text-green-900">0</p>
      </div>
      <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg text-center">
        <p class="text-xs text-purple-600 font-bold uppercase">Attendance Rate</p>
        <p id="statRate" class="text-2xl font-extrabold text-purple-900">0%</p>
      </div>
    </div>

    <!-- Add Guest Form -->
    <div class="bg-gray-50 p-4 rounded-md border mb-6">
      <h2 class="font-bold text-lg mb-3">Add Guest to Active Event</h2>
      <div class="flex flex-col md:flex-row gap-3">
        <input type="text" id="guestNameInput" placeholder="Guest Full Name" class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="guestTierInput" class="border p-2 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="General">General Admission</option>
          <option value="VIP">VIP</option>
          <option value="Speaker">Speaker</option>
          <option value="Staff">Staff</option>
        </select>
        <button id="addGuestBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-semibold transition">
          Add Guest
        </button>
      </div>
    </div>

    <!-- Guest List Table -->
    <h2 class="font-bold text-lg mb-3">Registered Guests</h2>
    <div class="overflow-x-auto border rounded-md">
      <table class="w-full text-left border-collapse bg-white">
        <thead>
          <tr class="bg-gray-100 border-b text-sm text-gray-600">
            <th class="p-3">Guest Name</th>
            <th class="p-3">Ticket ID</th>
            <th class="p-3">Status</th>
            <th class="p-3 text-center">Action</th>
          </tr>
        </thead>
        <tbody id="guestTableBody">
          <tr><td colspan="4" class="p-4 text-center text-gray-500">Select an event.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- QR CODE MODAL POPUP -->
  <div id="qrModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full text-center">
      <h3 id="modalGuestName" class="font-bold text-xl mb-4">Ticket Pass</h3>
      <div id="qrcode" class="flex justify-center mb-4"></div>
      <p id="modalTicketId" class="text-xs font-mono text-gray-500 mb-6 break-all"></p>
      
      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button id="downloadQrBtn" class="bg-green-600 text-white px-4 py-2 rounded flex-1 hover:bg-green-700 font-bold">Download QR</button>
        <button onclick="closeModal()" class="bg-gray-800 text-white px-4 py-2 rounded flex-1 hover:bg-gray-900">Close</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wpqpqlwjprtwoblhvenw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_89l1fu6nVSWxGVOH-g1dQw_i99aUXt9';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; } 
      else { await fetchEvents(); }
    }

    async function fetchEvents() {
      const { data } = await supabaseClient.from('events').select('*').order('event_name');
      const select = document.getElementById('eventSelect');
      select.innerHTML = '';
      if (!data || data.length === 0) {
        select.innerHTML = `<option value="">No events found.</option>`;
        return;
      }
      data.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.event_name;
        select.appendChild(opt);
      });
      fetchGuests();
    }

    // Create Event Handler with Expiration & Approval Status
    document.getElementById('addEventBtn').addEventListener('click', async () => {
      const name = document.getElementById('eventNameInput').value.trim();
      const expiresAt = document.getElementById('eventExpireInput').value; // Optional date picker
      
      if (!name) {
        alert('Please enter an event name.');
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert("You must be logged in.");
        return;
      }
      const userId = session.user.id;

      // Check tenant profile
      let { data: tenantData } = await supabaseClient.from('tenants').select('id, payment_status').eq('owner_id', userId).maybeSingle();
      let tenantId;

      if (!tenantData) {
        const { data: newTenant } = await supabaseClient
          .from('tenants')
          .insert([{ owner_id: userId, company_name: 'My Organization', payment_status: 'Pending', email: session.user.email }])
          .select('id')
          .single();
        tenantId = newTenant.id;
      } else {
        tenantId = tenantData.id;
        // Check if tenant payment is active/paid
        if (tenantData.payment_status !== 'Paid') {
          alert('Your account payment status is Pending. Please contact admin to activate event creation.');
          return;
        }
      }

      // Create Event (Defaults to NOT approved, waiting for admin)
      const { error } = await supabaseClient
        .from('events')
        .insert([{ 
          event_name: name, 
          total_capacity: 100, 
          tenant_id: tenantId,
          is_approved: false, // Requires Admin approval
          expires_at: expiresAt ? new Date(expiresAt).toISOString() : null
        }]);

      if (error) {
        alert('Error creating event: ' + error.message);
      } else {
        document.getElementById('eventNameInput').value = '';
        alert('Event created successfully! Waiting for Admin approval.');
        fetchEvents();
      }
    });

    async function fetchGuests() {
      const eventId = document.getElementById('eventSelect').value;
      const tbody = document.getElementById('guestTableBody');
      if (!eventId) return;

      const { data } = await supabaseClient.from('guests').select('*').eq('event_id', eventId).order('guest_name');
      tbody.innerHTML = '';

      let total = 0, checkedIn = 0;

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No guests yet.</td></tr>`;
      } else {
        total = data.length;
        data.forEach(g => {
          const isCheckedIn = (g.checked_in_count || 0) > 0;
          if (isCheckedIn) checkedIn++;

          const row = document.createElement('tr');
          row.className = 'border-b hover:bg-gray-50 text-sm';
          row.innerHTML = `
            <td class="p-3 font-medium">${g.guest_name}</td>
            <td class="p-3 font-mono text-xs text-gray-500">${g.id.substring(0,8)}...</td>
            <td class="p-3"><span class="${isCheckedIn ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'} px-2 py-1 rounded text-xs font-bold">${isCheckedIn ? 'Checked In' : 'Pending'}</span></td>
            <td class="p-3 text-center">
              <button onclick="showTicket('${g.id}', '${g.guest_name}')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-xs font-bold hover:bg-blue-200">View QR</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      // Update Analytics Counters
      document.getElementById('statTotal').innerText = total;
      document.getElementById('statCheckedIn').innerText = checkedIn;
      document.getElementById('statRate').innerText = total > 0 ? Math.round((checkedIn / total) * 100) + '%' : '0%';
    }

    // Add Guest Handler with Approval, Expiration, and Capacity Rules
    document.getElementById('addGuestBtn').addEventListener('click', async () => {
      const name = document.getElementById('guestNameInput').value.trim();
      const tier = document.getElementById('guestTierInput').value;
      const capacity = parseInt(document.getElementById('guestCapacityInput').value) || 1;
      const eventId = document.getElementById('eventSelect').value;
      
      if (!name || !eventId) return alert('Enter guest name and select event.');

      // 1. Verify if event is approved and not expired
      const { data: eventData, error: eventErr } = await supabaseClient
        .from('events')
        .select('is_approved, expires_at')
        .eq('id', eventId)
        .single();

      if (eventErr || !eventData.is_approved) {
        alert('Action Blocked: This event has not been approved by the Admin yet.');
        return;
      }

      if (eventData.expires_at && new Date(eventData.expires_at) < new Date()) {
        alert('Action Blocked: This event has expired and is now disabled.');
        return;
      }

      // 2. Insert Guest with multi-person allowed_capacity
      const { error } = await supabaseClient.from('guests').insert([{ 
        guest_name: name, 
        event_id: eventId, 
        ticket_tier: tier,
        allowed_capacity: capacity, 
        checked_in_count: 0 
      }]);

      if (error) {
        alert('Error adding guest: ' + error.message);
      } else {
        document.getElementById('guestNameInput').value = '';
        document.getElementById('guestCapacityInput').value = '1';
        fetchGuests();
      }
    });

    // QR Modal Handler
    function showTicket(id, name) {
      document.getElementById('modalGuestName').innerText = name;
      document.getElementById('modalTicketId').innerText = 'ID: ' + id;
      
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      
      // Generate QR Code
      const qrcode = new QRCode(qrContainer, { text: id, width: 180, height: 180 });

      // Enable Download Button
      const downloadBtn = document.getElementById('downloadQrBtn');
      downloadBtn.onclick = function() {
        // Find the canvas or image generated by qrcode.js
        const img = qrContainer.querySelector('img');
        const canvas = qrContainer.querySelector('canvas');

        let imageUrl = '';
        if (canvas) {
          imageUrl = canvas.toDataURL("image/png");
        } else if (img) {
          imageUrl = img.src;
        }

        if (imageUrl) {
          const link = document.createElement('a');
          link.href = imageUrl;
          link.download = `${name.replace(/\s+/g, '_')}_Ticket.png`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } else {
          alert('Please wait a second for the QR code to finish rendering before downloading.');
        }
      };

      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    init();
  </script>
</body>
</html>
